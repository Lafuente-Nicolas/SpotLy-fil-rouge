# Base de données PostgreSQL pour le développement de Spotly.
# Démarrer : docker compose up -d   |   Arrêter : docker compose down
# Les identifiants sont lus dans le fichier .env (copié depuis .env.example).

services:
  db:
    image: postgres:18-alpine
    container_name: spotly-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - spotly-db-data:/var/lib/postgresql

volumes:
  spotly-db-data:
